name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: npm ci
      - name: Use the runner browser
        timeout-minutes: 3
        run: |
          for browser_command in google-chrome google-chrome-stable chromium chromium-browser; do
            if runtime_browser_path="$(command -v "$browser_command")"; then
              echo "CHROMIUM_PATH=$runtime_browser_path" >> "$GITHUB_ENV"
              "$runtime_browser_path" --version
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
      - name: Test catalog and configurator
        run: npm test
      - name: Test pointer interaction and hairstyle alignment
        run: npm run test:browser
      - name: Build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
